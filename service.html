<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#11213d">
  <meta name="description" content="Travel Zone xizmatlari haqida batafsil ma'lumot.">
  <title>Travel Zone xizmati</title>
  <link rel="stylesheet" href="css/service-detail.css">
  <script defer src="js/service-detail.js"></script>
</head>
<body>
  <main id="service-page" class="service-page" aria-live="polite">
    <a class="service-back" id="service-back" href="index.html">← Barcha xizmatlar</a>
    <section class="service-hero" id="service-hero">
      <img id="service-image" alt="" fetchpriority="high">
      <div class="service-hero__shade"></div>
      <div class="service-hero__content">
        <span class="service-kicker" id="service-kicker"></span>
        <h1 id="service-title"></h1>
        <p id="service-lead"></p>
        <a class="service-primary" id="service-cta" href="index.html#inquiry">So‘rov yuborish</a>
      </div>
    </section>
    <section class="service-intro">
      <p class="service-eyebrow">TRAVEL ZONE EXPERIENCE</p>
      <h2 id="service-intro-title"></h2>
      <p id="service-description"></p>
    </section>
    <section class="service-benefits" aria-label="Xizmat afzalliklari">
      <div id="service-benefit-list" class="service-benefit-list"></div>
    </section>
    <section class="service-steps">
      <div>
        <p class="service-eyebrow">QANDAY ISHLAYDI</p>
        <h2>Oddiy, shaffof va sizga mos</h2>
      </div>
      <ol id="service-step-list"></ol>
    </section>
    <section class="service-closing">
      <p>Keyingi sayohatingizni ishonch bilan boshlang.</p>
      <a class="service-primary" id="service-closing-cta" href="index.html#inquiry">Travel Zone bilan bog‘lanish</a>
    </section>
  </main>
</body>
</html>
